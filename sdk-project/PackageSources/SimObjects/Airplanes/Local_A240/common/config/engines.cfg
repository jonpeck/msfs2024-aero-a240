; Aero A240 powerplant: Rotax 912 ULS (1352 cc flat four, 100 hp at 5800 RPM,
; 2.43:1 reduction gearbox) driving a 68 inch, three-blade, ground-adjustable prop.

[VERSION]
major = 1
minor = 0

[GENERALENGINEDATA]
engine_type = 0
min_throttle_limit = 0
master_ignition_switch = 0
starter_type = 0
max_contrail_temperature = -30
; Engine.0 = z, x, y (ft from datum) - the propeller position
Engine.0 = 6.0, 0, 0
ThrustAnglesPitchHeading.0 = 0, 0
fuel_flow_scalar = 1

[PISTON_ENGINE]
; If climb or top speed is off in the sim, power_scalar is the knob to turn.
power_scalar = 1
cylinder_displacement = 20.63
compression_ratio = 10.8
number_of_cylinders = 4
max_rated_rpm = 5800
max_rated_hp = 100
fuel_metering_type = 1
cooling_type = 1
normalized_starter_torque = 0.3
starter_time = 1.5
turbocharged = 0
supercharged = 0
max_design_mp = 0
min_design_mp = 0
critical_altitude = 0
emergency_boost_type = 0
emergency_boost_mp_offset = 0
emergency_boost_gain_offset = 0
; The 912 has constant-depression carburettors: no mixture lever.
fuel_air_auto_mixture = 1
auto_ignition = 0
two_stroke_cycle = 0
number_of_magnetos = 2
max_rpm_mechanical_efficiency_scalar = 1
idle_rpm_mechanical_efficiency_scalar = 1
max_rpm_friction_scalar = 1
idle_rpm_friction_scalar = 1
; The SDK default for this table is 0:0 (zero efficiency), which gives zero output torque:
; the engine started, then wound down and stopped. Values are estimates. In the sim this gives
; ~1480 RPM idle and ~5065 RPM / 134 ft-lb static at full throttle - more than the 912's rated
; 100 hp, so power_scalar (~0.75) is the knob if climb and speed come out too strong.
engine_mechanical_efficiency_table = 0:0.8, 1400:0.8, 4000:0.85, 5800:0.85
engine_friction_table = 0:3, 1400:5, 4000:10, 5800:15
BestPowerSpecificFuelConsumption = 0.43
min_cruise_rpm = 4300
max_cruise_rpm = 5500
max_indicated_rpm = 6000
egt_tuning_constant = 1
egt_peak_temperature = 2060
egt_tc = 2
cht_tuning_constant = 1
cht_cooling_constant = 1
cht_heating_constant = 760
cht_tc = 0.05
oil_temp_tuning_constant = 1
oil_temp_cooling_constant = 0.21
oil_temp_heating_constant = 700
oil_temp_tc = 0.03
oil_press_tuning_constant = 1
oil_press_max = 8640
oil_press_tc = 0.8
fuel_press_tuning_constant = 1
fuel_press_max = 720
fuel_press_tc = 2

[PROPELLER]
thrust_scalar = 1
propeller_type = 1
propeller_diameter = 5.67
propeller_blades = 3
propeller_moi = 1.2
beta_max = 65
beta_min = 15
min_gov_rpm = 0
prop_tc = 0.1
gear_reduction_ratio = 2.43
; Blade pitch at 75% radius. Lower = more static RPM and climb, less cruise speed.
fixed_pitch_beta = 20.5
low_speed_theory_limit = 80
prop_sync_available = 0
prop_deice_available = 0
prop_feathering_available = 0
prop_auto_feathering_available = 0
min_rpm_for_feather = 0
beta_feather = 0
power_absorbed_cf = 0
defeathering_accumulators_available = 0
prop_reverse_available = 0
minimum_on_ground_beta = 0
minimum_reverse_beta = 0
rotation = 1
; Model nodes the sim spins with the propeller (see tools/build_model.py).
prop_node.0 = Nodes:PROPELLER, PROPELLER_Blur
