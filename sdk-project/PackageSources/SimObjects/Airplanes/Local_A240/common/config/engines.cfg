; Aero A240 powerplant: Rotax 915 iS, as in Aeropro's current Garmin panel (START button,
; Lane A/B and Pump A/B switches). 1352 cc turbocharged flat four with fuel injection and a
; dual-lane engine computer: 141 hp take-off (5 min) at 5800 RPM, 135 hp continuous at
; 5500 RPM, turbo holds power to ~15,000 ft, 2.54:1 reduction gearbox. Driving a 68 inch,
; three-blade, ground-adjustable prop (the panel has no propeller control).

[VERSION]
major = 1
minor = 0

[GENERALENGINEDATA]
engine_type = 0
min_throttle_limit = 0
master_ignition_switch = 0
starter_type = 0
max_contrail_temperature = -30
; Engine.0 = z, x, y (ft from datum) - the propeller position
Engine.0 = 5.38, 0, 0
ThrustAnglesPitchHeading.0 = 0, 0
fuel_flow_scalar = 1

[PISTON_ENGINE]
; If climb or top speed is off in the sim, power_scalar is the knob to turn. The 912 setup
; with power_scalar 1 made ~130 hp unboosted; with the turbo's extra manifold pressure that
; becomes ~200 hp, so 0.7 aims at the 915's 141 hp. Estimate - check in the sim.
power_scalar = 0.7
cylinder_displacement = 20.63
; Estimate: lower than the 912's 10.8:1, as usual for a turbo engine.
compression_ratio = 8.2
number_of_cylinders = 4
max_rated_rpm = 5800
max_rated_hp = 141
; 0 = fuel injected
fuel_metering_type = 0
cooling_type = 1
normalized_starter_torque = 0.3
starter_time = 1.5
turbocharged = 1
supercharged = 0
; inHg at full throttle up to critical_altitude. The 915's figure is not in the sources found;
; ~40 inHg is an estimate. Keep the MAN IN marks in panel/panel.xml in step with it.
max_design_mp = 40
min_design_mp = 0
critical_altitude = 15000
emergency_boost_type = 0
emergency_boost_mp_offset = 0
emergency_boost_gain_offset = 0
; The engine computer sets the mixture: no mixture lever. Mix on the boosted (intake)
; density, so it does not lean out while the turbo still delivers sea-level air.
fuel_air_auto_mixture = 1
use_intake_density_on_mixture = 1
auto_ignition = 0
two_stroke_cycle = 0
number_of_magnetos = 2
max_rpm_mechanical_efficiency_scalar = 1
idle_rpm_mechanical_efficiency_scalar = 1
max_rpm_friction_scalar = 1
idle_rpm_friction_scalar = 1
; The SDK default for this table is 0:0 (zero efficiency), which gives zero output torque:
; the engine started, then wound down and stopped. Values are estimates. In the sim this gives
; ~1480 RPM idle and ~5065 RPM / 134 ft-lb static at full throttle with the 912 (before the
; turbo and the power_scalar above).
engine_mechanical_efficiency_table = 0:0.8, 1400:0.8, 4000:0.85, 5800:0.85
engine_friction_table = 0:3, 1400:5, 4000:10, 5800:15
BestPowerSpecificFuelConsumption = 0.43
min_cruise_rpm = 4300
max_cruise_rpm = 5500
max_indicated_rpm = 6000
egt_tuning_constant = 1
egt_peak_temperature = 2060
egt_tc = 2
cht_tuning_constant = 1
cht_cooling_constant = 1
cht_heating_constant = 760
cht_tc = 0.05
oil_temp_tuning_constant = 1
oil_temp_cooling_constant = 0.21
oil_temp_heating_constant = 700
oil_temp_tc = 0.03
oil_press_tuning_constant = 1
oil_press_max = 8640
oil_press_tc = 0.8
fuel_press_tuning_constant = 1
; psf: ~42 psi (2.9 bar), inside the 915's 2.8-3.2 bar band (the 912's carburettors ran at ~5 psi)
fuel_press_max = 6050
fuel_press_tc = 2

[PROPELLER]
thrust_scalar = 1
propeller_type = 1
propeller_diameter = 5.67
propeller_blades = 3
propeller_moi = 1.2
beta_max = 65
beta_min = 15
min_gov_rpm = 0
prop_tc = 0.1
gear_reduction_ratio = 2.54
; Blade pitch at 75% radius. Lower = more static RPM and climb, less cruise speed.
; Coarser than the 912's 20.5 to absorb the extra power; tune for ~5500 RPM static.
fixed_pitch_beta = 23
low_speed_theory_limit = 80
prop_sync_available = 0
prop_deice_available = 0
prop_feathering_available = 0
prop_auto_feathering_available = 0
min_rpm_for_feather = 0
beta_feather = 0
power_absorbed_cf = 0
defeathering_accumulators_available = 0
prop_reverse_available = 0
minimum_on_ground_beta = 0
minimum_reverse_beta = 0
rotation = 1
; Model nodes the sim spins with the propeller (see tools/build_model.py).
prop_node.0 = Nodes:PROPELLER, PROPELLER_Blur
