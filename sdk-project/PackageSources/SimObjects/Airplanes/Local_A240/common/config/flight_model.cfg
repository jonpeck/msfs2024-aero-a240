; Aero A240 flight model.
;
; Conventions: positions are "longitudinal (z), lateral (x), vertical (y)" in FEET,
; + forward / + right / + up, measured from the datum.
; The datum is the 3D model origin: on the centreline, at the wing quarter-chord,
; at propeller thrust-line height. The model sits with its wheels 3.675 ft below it.
;
; Published A240 numbers used here: span 29 ft 11 in, wing area 122.7 sq ft,
; length 18 ft 6 in, empty 655 lb, gross 1235 lb, 22.5 gal fuel, 100 hp,
; cruise ~100 kt, stall ~43 kt clean / ~35 kt with flaps, climb ~1000 fpm.
; Everything else (inertia, tail areas, coefficients) is an estimate - tune in the sim.

