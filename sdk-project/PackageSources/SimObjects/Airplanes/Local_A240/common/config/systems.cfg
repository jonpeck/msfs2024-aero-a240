; Aero A240 systems: simple 12 V day/night VFR aircraft.
; Positions are z, x, y in feet from the datum (+ forward, + right, + up).

[VERSION]
major = 1
minor = 0

[LIGHTS]
; Type: 2 strobe, 3 navigation, 5 landing. The .fx files are in common/effects.
lightdef.0 = Name:Nav_Red#Type:3#Index:0#LocalPosition:-0.6,-14.96,2.05#LocalRotation:0,0,90#EffectFile:LIGHT_ASOBO_NavigationRed#PotentiometerIndex:1
lightdef.1 = Name:Nav_Green#Type:3#Index:0#LocalPosition:-0.6,14.96,2.05#LocalRotation:0,0,-90#EffectFile:LIGHT_ASOBO_NavigationGreen#PotentiometerIndex:1
lightdef.2 = Name:Nav_White#Type:3#Index:0#LocalPosition:-12.32,0,0.98#LocalRotation:180,0,0#EffectFile:LIGHT_ASOBO_NavigationWhite#PotentiometerIndex:1
lightdef.3 = Name:Strobe_Left#Type:2#Index:0#LocalPosition:-0.7,-14.96,2.05#LocalRotation:0,0,90#EffectFile:LIGHT_ASOBO_StrobeSimple#PotentiometerIndex:1
lightdef.4 = Name:Strobe_Right#Type:2#Index:0#LocalPosition:-0.7,14.96,2.05#LocalRotation:0,0,-90#EffectFile:LIGHT_ASOBO_StrobeSimple#PotentiometerIndex:1
lightdef.5 = Name:Landing#Type:5#Index:0#LocalPosition:5.25,0,-0.48#LocalRotation:8,0,0#EffectFile:LIGHT_ASOBO_LandingBelly#PotentiometerIndex:1

[ELECTRICAL]
; 1.0 = the simple bus / battery / alternator / circuit description (MSFS 2020 style).
Major = 1
Minor = 0
bus.1 = Name:Main_BUS
battery.1 = Connections:bus.1#Capacity:18#Voltage:curve.1#Name:Main_Battery
alternator.1 = Connections:bus.1#iEng:0#RatedVoltage:13.8#Load:curve.2
; battery state of charge : volts
curve.1 = 0:10.5, 0.1:11.8, 0.5:12.4, 0.9:12.7, 1:12.9
; engine RPM ratio : alternator amps
curve.2 = 0.2:0, 0.3:10, 0.5:18, 1:18
; Power = watts idle, watts max, minimum volts
circuit.1 = Type:CIRCUIT_GENERAL_PANEL:1#Connections:bus.1#Power:0.5, 1, 9.0#Name:General_Panel
circuit.2 = Type:CIRCUIT_STARTER:1#Connections:bus.1#Power:600, 900, 9.0#Name:Starter
circuit.3 = Type:CIRCUIT_AVIONICS:1#Connections:bus.1#Power:15, 25, 9.0#Name:EFIS
circuit.4 = Type:CIRCUIT_COM:1#Connections:bus.1#Power:4, 20, 9.0#Name:COM1
circuit.5 = Type:CIRCUIT_XPNDR:1#Connections:bus.1#Power:8, 12, 9.0#Name:Transponder
circuit.6 = Type:CIRCUIT_LIGHT_NAV:1#Connections:bus.1#Power:10, 15, 9.0#Name:Nav_Lights
circuit.7 = Type:CIRCUIT_LIGHT_STROBE:1#Connections:bus.1#Power:15, 25, 9.0#Name:Strobe_Lights
circuit.8 = Type:CIRCUIT_LIGHT_LANDING:1#Connections:bus.1#Power:25, 40, 9.0#Name:Landing_Light

