; One Garmin G3X Touch GDU 460 (10.6 in, 1280 x 768), using the sim's own Working Title
; G3X Touch v2, drawn onto the model material named "EFIS_Display" (the screen quad in
; A240_interior.gltf). Its configuration (sensors, radio, transponder, engine strip) is in
; panel.xml next to this file. The instrument index (?Index=1) must match panel.xml.
;
; To go back to the package's own simple display (html_ui/.../LocalA240/EFIS), replace the
; htmlgauge00 line with:
;   htmlgauge00 = LocalA240/EFIS/EFIS.html, 128, 0, 1024, 768

[VCockpit01]
size_mm     = 1280, 768
pixel_size  = 1280, 768
texture     = EFIS_Display
htmlgauge00 = NavSystems/G3XTouchv2/G3XTouch.html?Index=1, 0, 0, 1280, 768
